[project]
name = "ai-sandbox-harness-workshop"
version = "0.2.0"
description = "Generic, multi-stack Antigravity Engineering Harness (App & agy CLI) with lifecycle hooks, 1:1 skills & sub-agents, semantic memory, telemetry, and verification loops."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["demo_api/tests"]
pythonpath = ["demo_api/src"]
